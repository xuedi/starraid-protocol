syntax = "proto3";

package starraid.v1;

import "starraid/v1/common.proto";

option go_package = "github.com/xuedi/starraid-protocol/gen/go/starraidv1;starraidv1";
option csharp_namespace = "Starraid.Protocol.V1";

// Interest-managed neighbour updates (the "beacon" pattern). The server pushes
// only what the client's sensors can perceive (see docs/objects.md, docs/server.md).

message ObjectEnter {
  uint64 object_id = 1;
  Vec2 position = 2;
  // The object's class key (object_class.key — "skiff", "hauler", "station", …)
  // so the client can pick a sprite per object (see docs/objects.md). Derived
  // attributes (mass/power/speed/shield) stay server-internal for now.
  string type_key = 3;
}

message ObjectUpdate {
  uint64 object_id = 1;
  Vec2 position = 2;
}

message ObjectLeave {
  uint64 object_id = 1;
}
