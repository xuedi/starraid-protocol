syntax = "proto3";

package starraid.v1;

import "starraid/v1/session.proto";
import "starraid/v1/self.proto";
import "starraid/v1/navigation.proto";
import "starraid/v1/world.proto";

option go_package = "github.com/xuedi/starraid-protocol/gen/go/starraidv1;starraidv1";
option csharp_namespace = "Starraid.Protocol.V1";

// Directional envelopes. Every frame on the wire is exactly one envelope, so the
// receiver always knows the message type (and direction) via the oneof. Two
// envelopes — one per direction — keep illegal-direction messages off the wire.
//
// Framing: each envelope is sent as a length-prefixed frame — a 4-byte
// big-endian uint32 byte length followed by the marshalled envelope (see
// protocol/README.md). The oneof grows additively as new messages are added.

// Client → server (intent / commands). See docs/protocol.md for the taxonomy.
message ClientMessage {
  oneof msg {
    Hello hello = 1;
    LoginRequest login = 2;
    Move move = 3;
    Stop stop = 4;
  }
}

// Server → client (authoritative results / events). See docs/protocol.md.
message ServerMessage {
  oneof msg {
    VersionResult version_result = 1;
    LoginResult login_result = 2;
    SelfAssign self_assign = 3;
    SelfUpdate self_update = 4;
    // Interest-managed neighbour beacons (see world.proto, docs/objects.md).
    ObjectEnter object_enter = 5;
    ObjectUpdate object_update = 6;
    ObjectLeave object_leave = 7;
  }
}
